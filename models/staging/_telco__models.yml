# models/staging/_telco__models.yml
version: 2

models:
  - name: stg_telco__demographics
    description: >
      One row per customer. Renames source columns to snake_case, drops the
      constant `Count` column from the raw export, and drops `Dependents`,
      `Under 30` and `Senior Citizen` as redundant - age bands are derived
      downstream from `age`. String columns are lower-cased.
    columns:
      - name: customer_id
        description: Primary key. Sourced from `Customer ID`, lower-cased.
        tests:
          - unique
          - not_null
      - name: gender
        description: Customer gender, lower-cased ('male'/'female').
      - name: age
        description: Customer age in years. `is_senior` is derived from this downstream.
      - name: married
        description: Whether the customer is married. Arrives from the seed as a boolean.
      - name: number_of_dependents
        description: >
          Count of dependents living with the customer. The source `Dependents`
          flag was dropped because it is just this column > 0.

  - name: stg_telco__location
    description: >
      One row per customer. `Country` and `State` are constants in this extract
      (United States / California) and `lat_long` duplicates `latitude` and
      `longitude`; the `Count` column is an artefact of the export. String
      columns are lower-cased.
    columns:
      - name: customer_id
        description: Primary key. Sourced from `Customer ID`, lower-cased.
      - name: country
        description: Constant 'united states' in this extract, lower-cased.
      - name: state
        description: Constant 'california' in this extract, lower-cased.
      - name: city
        description: Customer city, lower-cased. One city per zip_code - verified in zip_lookup.
      - name: zip_code
        description: >
          Cast to string so it is never treated as a number and never loses a
          leading zero. Digits only, so no lower() is applied. Joins to
          stg_telco__population.
      - name: latitude
        description: Latitude of the customer's zip_code. One value per zip_code.
      - name: longitude
        description: Longitude of the customer's zip_code. One value per zip_code.

  - name: stg_telco__population
    description: >
      One row per zip_code. `zip_id` carries no information and joins to
      nothing, so it is dropped along with the export's `Count` column.
    columns:
      - name: zip_code
        description: Primary key. Cast to string to match stg_telco__location.
      - name: population
        description: Population of the zip_code. Rolled into zip_lookup downstream.

  - name: stg_telco__services
    description: >
      One row per customer, covering the services subscribed to and the charges
      billed. `Quarter` is a constant and the `Count` column is an export
      artefact; both are dropped. String columns are lower-cased; the Yes/No
      service flags arrive from the seed as booleans and are left as-is.
    columns:
      - name: customer_id
        description: Primary key. Sourced from `Customer ID`, lower-cased.
      - name: referred_a_friend
        description: Whether the customer referred anyone. Boolean; equivalent to number_of_referrals > 0.
      - name: number_of_referrals
        description: Count of referrals the customer made.
      - name: tenure_in_months
        description: Months the customer has been with the company.
      - name: offer
        description: >
          Last marketing offer accepted, lower-cased ('offer a' through
          'offer e'), or 'none' where no offer was taken.
      - name: phone_service
        description: Whether the customer subscribes to home phone service. Boolean.
      - name: avg_monthly_long_distance_charges
        description: Average long distance charge per month, in USD. 0 where there is no phone service.
      - name: multiple_lines
        description: Whether the customer has multiple phone lines. Boolean.
      - name: internet_service
        description: Whether the customer subscribes to internet service. Boolean.
      - name: internet_type
        description: >
          Connection type, lower-cased ('dsl', 'fiber optic', 'cable'), or
          'none' where there is no internet service.
      - name: avg_monthly_gb_download
        description: Average monthly download volume in GB. 0 where there is no internet service.
      - name: online_security
        description: Whether the customer subscribes to the online security add-on. Boolean.
      - name: online_backup
        description: Whether the customer subscribes to the online backup add-on. Boolean.
      - name: device_protection_plan
        description: Whether the customer subscribes to the device protection plan. Boolean.
      - name: premium_tech_support
        description: Whether the customer subscribes to premium tech support. Boolean.
      - name: streaming_tv
        description: Whether the customer streams TV over their internet service. Boolean.
      - name: streaming_movies
        description: Whether the customer streams movies over their internet service. Boolean.
      - name: streaming_music
        description: Whether the customer streams music over their internet service. Boolean.
      - name: unlimited_data
        description: Whether the customer is on an unlimited data plan. Boolean.
      - name: contract
        description: Contract term, lower-cased ('month-to-month', 'one year', 'two year').
      - name: paperless_billing
        description: Whether the customer is on paperless billing. Boolean.
      - name: payment_method
        description: Payment method, lower-cased ('bank withdrawal', 'credit card', 'mailed check').
      - name: monthly_charge
        description: Current total monthly charge for all services, in USD.
      - name: total_charges
        description: Total charged to the customer to date, in USD.
      - name: total_refunds
        description: Total refunded to the customer to date, in USD.
      - name: total_extra_data_charges
        description: Total charged for data over the plan allowance, in USD.
      - name: total_long_distance_charges
        description: Total long distance charges to date, in USD.
      - name: total_revenue
        description: >
          Total revenue from the customer to date, in USD. Derived from the
          other charge columns in the source, so treat it as redundant.

  - name: stg_telco__status
    description: >
      One row per customer, holding churn outcome and post-hoc scoring.
      `Churn Value` is an encoding of `Churn Label` and `Quarter` is a constant;
      both are dropped, as is the export's `Count` column. String columns are
      lower-cased. Most of these columns are outcome data - see the marts layer
      for which are treated as leakage.
    columns:
      - name: customer_id
        description: Primary key. Sourced from `Customer ID`, lower-cased.
      - name: customer_status
        description: Status at the end of the quarter, lower-cased ('churned', 'stayed', 'joined').
      - name: satisfaction_score
        description: >
          Survey score from 1 to 5. Collected alongside the outcome, so it is
          leakage for churn prediction.
      - name: churn_label
        description: Whether the customer churned this quarter. Boolean; the target.
      - name: churn_score
        description: >
          Vendor-supplied churn propensity from 0 to 100. A model output, not an
          input - leakage for churn prediction.
      - name: cltv
        description: Predicted customer lifetime value, in USD.
      - name: churn_reason
        description: >
          Free-text reason given for churning, lower-cased. Null unless the
          customer churned, so it is leakage for churn prediction.
      - name: churn_category
        description: >
          Grouping of churn_reason, lower-cased ('competitor', 'dissatisfaction',
          'attitude', 'price', 'other'). Null unless the customer churned, so it
          is leakage for churn prediction.
